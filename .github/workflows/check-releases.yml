name: Check upstream releases

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch a build for the newest missing stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/cloudflare/cloudflared/releases/latest --jq .tag_name)
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Latest upstream release is not a stable numeric tag: $tag"
            exit 0
          }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already published: $tag"
            exit 0
          fi
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_tag="$tag"
