name: Build cloudflared riscv64

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Official cloudflare/cloudflared release tag
        required: true
        default: '2026.10.7'
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: build-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact upstream tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cloudflare/cloudflared
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1

      - name: Set build metadata
        id: metadata
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid release tag: $TAG" >&2
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go from upstream go.mod
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static Linux riscv64 binary
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          BUILD_TIME: ${{ steps.metadata.outputs.build_time }}
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=riscv64 go build \
            -mod=readonly -trimpath -ldflags="-s -w -X main.Version=${TAG} -X main.BuildTime=${BUILD_TIME}" \
            -o cloudflared-linux-riscv64 ./cmd/cloudflared
          chmod 0755 cloudflared-linux-riscv64

      - name: Verify architecture and version under RISC-V emulation
        run: |
          set -euo pipefail
          file cloudflared-linux-riscv64 | grep -E 'ELF 64-bit.*RISC-V'
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-user-static
          qemu-riscv64-static ./cloudflared-linux-riscv64 --version

      - name: Create checksums and build details
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.source_commit }}
          BUILD_TIME: ${{ steps.metadata.outputs.build_time }}
        run: |
          set -euo pipefail
          sha256sum cloudflared-linux-riscv64 > SHA256SUMS
          {
            echo "# cloudflared Linux riscv64 build"
            echo
            echo "- Upstream repository: https://github.com/cloudflare/cloudflared"
            echo "- Release tag: ${TAG}"
            echo "- Source commit: ${SOURCE_COMMIT}"
            echo "- Build time (UTC): ${BUILD_TIME}"
            echo "- Target: linux/riscv64"
            echo "- CGO: disabled (static binary)"
            echo "- Go: $(go version)"
          } > BUILD-INFO.md

      - name: Generate GitHub build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: cloudflared-linux-riscv64
          bundle-path: cloudflared-linux-riscv64.attestation.json

      - name: Publish release assets without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "cloudflared ${TAG} Linux riscv64" \
            --notes-file BUILD-INFO.md \
            cloudflared-linux-riscv64 SHA256SUMS BUILD-INFO.md cloudflared-linux-riscv64.attestation.json
